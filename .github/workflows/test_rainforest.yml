name: Test rainforest

on:
  push:
    branches:
      - dev
      - master

  pull_request:
    branches:
      - dev
      - master

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Run the build with tmate debugging enabled
        required: false
        default: false

jobs:
  unit_tests:
    name: Unit Tests (${{ matrix.python-version }}, ${{ matrix.os }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
      max-parallel: 6

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.in-project true

      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install rainforest
        run: |
          poetry install --with test

      - name: Create rainforest_data folder
        run: |
          mkdir -p "${{ github.workspace }}/rainforest_data"

      - name: Check installed package import
        env:
          AWS_KEY: ${{ secrets.AWS_KEY }}
          AWS_SECRET: ${{ secrets.AWS_SECRET }}
          RAINFOREST_DATAPATH: ${{ github.workspace }}/rainforest_data
        run: |
          PYTHON_EXECUTABLE="$(poetry env info --executable)"
          cd /tmp
          "$PYTHON_EXECUTABLE" -c \
            "import rainforest; print(rainforest.__file__)"

      - name: Run linting
        run: |
          poetry run ruff check rainforest

      - name: Run tests
        env:
          AWS_KEY: ${{ secrets.AWS_KEY }}
          AWS_SECRET: ${{ secrets.AWS_SECRET }}
          RAINFOREST_DATAPATH: ${{ github.workspace }}/rainforest_data
        run: |
          poetry run pytest tests_ci
